name: Build Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/zynboot

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: system
            jar: zyn-app-system
            port: 28081
          - name: demo
            jar: zyn-app-demo
            port: 28080
          - name: gateway
            jar: zyn-app-gateway
            port: 28000

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -P prod -DskipTests -B -pl zyn-app/${{ matrix.app.jar }} -am

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: deploy/app/image
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app.name }}:latest
          build-args: |
            JAR_FILE=zyn-app/${{ matrix.app.jar }}/target/${{ matrix.app.jar }}-1.0.0-SNAPSHOT.jar
