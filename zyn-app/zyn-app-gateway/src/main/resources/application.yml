server:
  port: 28000

spring:
  application:
    name: zyn-gateway
  profiles:
    active: @spring.profiles.active@
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:Zyn@secure#99}
      database: 0
  cloud:
    gateway:
      routes:
        - id: system
          uri: ${SYS_BASE_URL:http://localhost:28081}
          predicates:
            - Path=/sys/**
          filters:
            - StripPrefix=1
        - id: demo
          uri: ${DEMO_BASE_URL:http://localhost:28080}
          predicates:
            - Path=/demo/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            max-age: 3600
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      eager: true
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":"429","message":"请求过于频繁，请稍后重试"}'
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR:localhost:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:Zyn@secure#99}
            data-id: gateway-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: gw-flow

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

springdoc:
  swagger-ui:
    urls:
      - name: system
        url: /sys/v3/api-docs
      - name: demo
        url: /demo/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    com.zynboot: debug
    org.springframework.cloud.gateway: debug
