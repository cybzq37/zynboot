server:
  port: 28080

spring:
  application:
    name: zyn-demo
  profiles:
    active: @spring.profiles.active@
  config:
    import:
      - classpath:zyn-conf-common.yml
      - classpath:zyn-conf-@spring.profiles.active@.yml
      - optional:nacos:zyn-conf-common.yml
      - optional:nacos:zyn-conf-@spring.profiles.active@.yml
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
    stream:
      bindings:
        event-out-0:
          destination: zyn-event
          content-type: application/json
        event-in-0:
          destination: zyn-event
          content-type: application/json
          group: demo-group
      function:
        definition: eventIn
